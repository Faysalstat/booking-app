<section class="h-custom" style="background-color: #8fc4b7; padding: 2rem 0;">
    <div class="container">
        <div class="row d-flex justify-content-center">
            <div class="col-lg-8 col-xl-6">
                <div class="card rounded-3">
                    <img src="https://mdbcdn.b-cdn.net/img/Photos/new-templates/bootstrap-registration/img3.webp"
                        class="w-100" style="border-top-left-radius: .3rem; border-top-right-radius: .3rem;"
                        alt="Sample photo">
                    <div class="card-body p-4 p-md-5">
                        <h3 class="mb-4 pb-2 pb-md-0 mb-md-5 px-md-2">Change Password</h3>
                        <form [formGroup]="passwordChangeForm">
                            <mat-form-field appearance="outline" class="w-100 mb-3">
                                <mat-label>User Name</mat-label>
                                <input matInput type="text" placeholder="Enter user name" formControlName="userName">
                            </mat-form-field>

                            <!-- Password -->
                            <mat-form-field appearance="outline" class="w-100 mb-3">
                                <mat-label>Previous Password</mat-label>
                                <input matInput type="password" placeholder="Enter previous password" formControlName="previousPassword">
                            </mat-form-field>

                            <mat-form-field appearance="outline" class="w-100 mb-3">
                                <mat-label>New Password</mat-label>
                                <input matInput type="password" placeholder="Enter new password" formControlName="newPassword">
                            </mat-form-field>
                            <button class="w-100 mb-3" [disabled]="!passwordChangeForm.valid" mat-raised-button color="primary" type="submit" (click)="changePassword()">Change Password</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>
