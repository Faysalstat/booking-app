server.port: 8000

#spring configs
spring:
  main:
    web-application-type: reactive
  application:
    name: api-gateway
  cloud:
    gateway:
      globalcors:
        add-to-simple-url-handler-mapping: true
        cors-configurations:
          '[/**]':
            allowedOrigins: "http://localhost:4200"
            allowedMethods:
            - POST
            - PUT
            - GET
            - OPTIONS
            allowedHeaders:
            - "Origin"
            - "Content-Type"
            - "Accept"
            - "Authorization"
            - "Referer"
      routes:
      - id: security-service
        uri: lb://security-service
        predicates:
          - Path=/api/auth/**
      - id: booking-service
        uri: lb://booking-service
        predicates:
          - Path=/api/booking-service/**
        filters:
#          - AuthenticationFilter
#      - id: client-service
#        uri: lb://client-service
#        predicates:
#          - Path=/client/**
#        filters:
#          - AuthenticationFilter
#      - id: category-service
#        uri: lb://category-service
#        predicates:
#          - Path=/category/**
#        filters:
#          - AuthenticationFilter
eureka:
  client:
    instance:
      preferIpAddress: true
    serviceUrl:
      defaultZone: http://localhost:8761/eureka